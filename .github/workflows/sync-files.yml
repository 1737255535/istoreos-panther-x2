name: Sync Files

on:
  repository_dispatch:
  workflow_dispatch:
  # schedule:
    # - cron: 35 15 * * 3

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 准备完成
      uses: actions/checkout@main

    - name: 下载架构编译配置文件
      run: |
        mkdir -p ./armv8
        wget --no-check-certificate --no-cache -O ./armv8/feeds.conf https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf
        wget --no-check-certificate --no-cache -O ./armv8/.config https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo

        FILE_PATH="./armv8/.config"
        if [ -f "$FILE_PATH" ] && [ -s "$FILE_PATH" ]; then
           content=$(cat ${GITHUB_WORKSPACE}/configfiles/config_data-6.x.txt)
           configdata=$(echo "$content" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
           # ------------禁用非必要软件包，由AI生成------------
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_cyber_cyber3588-aib=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_cyber_cyber3588-aib is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_fastrhino_r6xs=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_fastrhino_r6xs is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r2s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r2s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r3s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r3s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4se=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r4se is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_h88k=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_h88k is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc-h6xk is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hlink_h28k=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hlink_h28k is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_lyt_t68m=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_lyt_t68m is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_lyt_t88m=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_lyt_t88m is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e20c=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e20c is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e24c=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e24c is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e52c=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e52c is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e54c=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_e54c is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-4c-plus=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-4c-plus is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-4se=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-4se is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_roceos_k60pro=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_roceos_k60pro is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_xunlong_orangepi-5-plus=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_xunlong_orangepi-5-plus is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_ars4=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_ars4 is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r1-lite=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r1-lite is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r6s=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r6s is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r1=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r1 is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_a2=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_a2 is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r2=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_easepi_r2 is not set/' ./armv8/.config
           sed -i 's/^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-5t=y/# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_radxa_rock-5t is not set/' ./armv8/.config
           
           sed -i 's/^CONFIG_PACKAGE_adb=y/# CONFIG_PACKAGE_adb is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_adb-enablemodem=y/# CONFIG_PACKAGE_adb-enablemodem is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_appfilter=y/# CONFIG_PACKAGE_appfilter is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_comgt=y/# CONFIG_PACKAGE_comgt is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_comgt-directip=y/# CONFIG_PACKAGE_comgt-directip is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_comgt-ncm=y/# CONFIG_PACKAGE_comgt-ncm is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddns-scripts=y/# CONFIG_PACKAGE_ddns-scripts is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddns-scripts-cloudflare=y/# CONFIG_PACKAGE_ddns-scripts-cloudflare is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddns-scripts-dnspod=y/# CONFIG_PACKAGE_ddns-scripts-dnspod is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddns-scripts-services=y/# CONFIG_PACKAGE_ddns-scripts-services is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddns-scripts_aliyun=y/# CONFIG_PACKAGE_ddns-scripts_aliyun is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_ddnsto=y/# CONFIG_PACKAGE_ddnsto is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-fs-hfs=y/# CONFIG_PACKAGE_kmod-fs-hfs is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-fs-hfsplus=y/# CONFIG_PACKAGE_kmod-fs-hfsplus is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-mhi-bus=y/# CONFIG_PACKAGE_kmod-mhi-bus is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-mhi-net=y/# CONFIG_PACKAGE_kmod-mhi-net is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-mhi-wwan-ctrl=y/# CONFIG_PACKAGE_kmod-mhi-wwan-ctrl is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-mhi-wwan-mbim=y/# CONFIG_PACKAGE_kmod-mhi-wwan-mbim is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-oaf=y/# CONFIG_PACKAGE_kmod-oaf is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y/# CONFIG_PACKAGE_kmod-usb-net-cdc-mbim is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y/# CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y/# CONFIG_PACKAGE_kmod-usb-net-qmi-wwan is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-usb-serial-option=y/# CONFIG_PACKAGE_kmod-usb-serial-option is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-wireguard=y/# CONFIG_PACKAGE_kmod-wireguard is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_kmod-wwan=y/# CONFIG_PACKAGE_kmod-wwan is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_linkease=y/# CONFIG_PACKAGE_linkease is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_linkmount=y/# CONFIG_PACKAGE_linkmount is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-ddns=y/# CONFIG_PACKAGE_luci-app-ddns is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-ddnsto=y/# CONFIG_PACKAGE_luci-app-ddnsto is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-filetransfer=y/# CONFIG_PACKAGE_luci-app-filetransfer is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-linkease=y/# CONFIG_PACKAGE_luci-app-linkease is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-mergerfs=y/# CONFIG_PACKAGE_luci-app-mergerfs is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-oaf=y/# CONFIG_PACKAGE_luci-app-oaf is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-ota=y/# CONFIG_PACKAGE_luci-app-ota is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-unet=y/# CONFIG_PACKAGE_luci-app-unet is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-lib-fs=y/# CONFIG_PACKAGE_luci-lib-fs is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-3g=y/# CONFIG_PACKAGE_luci-proto-3g is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-mbim=y/# CONFIG_PACKAGE_luci-proto-mbim is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-modemmanager=y/# CONFIG_PACKAGE_luci-proto-modemmanager is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-ncm=y/# CONFIG_PACKAGE_luci-proto-ncm is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-qmi=y/# CONFIG_PACKAGE_luci-proto-qmi is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-sstp=y/# CONFIG_PACKAGE_luci-proto-sstp is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-unet=y/# CONFIG_PACKAGE_luci-proto-unet is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-proto-wireguard=y/# CONFIG_PACKAGE_luci-proto-wireguard is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_mergerfs=y/# CONFIG_PACKAGE_mergerfs is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_modemmanager=y/# CONFIG_PACKAGE_modemmanager is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_qmi-utils=y/# CONFIG_PACKAGE_qmi-utils is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_strace=y/# CONFIG_PACKAGE_strace is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_tcpdump=y/# CONFIG_PACKAGE_tcpdump is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_umbim=y/# CONFIG_PACKAGE_umbim is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_unet-cli=y/# CONFIG_PACKAGE_unet-cli is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_unetd=y/# CONFIG_PACKAGE_unetd is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_uqmi=y/# CONFIG_PACKAGE_uqmi is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_wireguard-tools=y/# CONFIG_PACKAGE_wireguard-tools is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_wwan=y/# CONFIG_PACKAGE_wwan is not set/' ./armv8/.config
           
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-ddns-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-ddnsto-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-filetransfer-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-filetransfer-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-linkease-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-linkease-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-mergerfs-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-mergerfs-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-oaf-zh-cn is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-ota-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-ota-zh-cn is not set/' ./armv8/.config
           
           sed -i 's/^CONFIG_PACKAGE_kmod-aic8800s=m/# CONFIG_PACKAGE_kmod-aic8800s is not set/' ./armv8/.config
           
           sed -i 's/^CONFIG_MODEMMANAGER_WITH_MBIM=y/# CONFIG_MODEMMANAGER_WITH_MBIM is not set/' ./armv8/.config
           sed -i 's/^CONFIG_MODEMMANAGER_WITH_QMI=y/# CONFIG_MODEMMANAGER_WITH_QMI is not set/' ./armv8/.config
           sed -i 's/^CONFIG_MODEMMANAGER_WITH_QRTR=y/# CONFIG_MODEMMANAGER_WITH_QRTR is not set/' ./armv8/.config
           
           sed -i 's/^CONFIG_PACKAGE_webdav2=y/# CONFIG_PACKAGE_webdav2 is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_unishare=y/# CONFIG_PACKAGE_unishare is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-app-unishare=y/# CONFIG_PACKAGE_luci-app-unishare is not set/' ./armv8/.config
           sed -i 's/^CONFIG_PACKAGE_luci-i18n-unishare-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-unishare-zh-cn is not set/' ./armv8/.config
           # ----------------结束----------------
           echo -e "\\n$configdata" >> ./armv8/.config
           # 清除.config配置文件里面重复的配置项
           configdata2=$(cat ./armv8/.config)
           echo "$configdata2" | awk '!seen[$0]++ && NF > 0' > ./armv8/.config

           # ---- 设备归一化 ----
           # 上游 easepi-r1 的 config.buildinfo 会带入其它 rk3568/rk3566 板型
           # （如 firefly_station-m2=y），而上面的 sed 禁用清单并不完整。
           # 多余设备会白白拖长编译，甚至拉入不适用的 bootloader/DTB，
           # 导致 target/linux 阶段失败。这里统一收敛到本仓库唯一目标设备。
           sed -i -E 's/^(CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*)=y$/# \1 is not set/' ./armv8/.config
           # 兜底：确保目标设备被启用
           sed -i '/^# CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_panther_x2 is not set$/d' ./armv8/.config
           grep -q '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_panther_x2=y$' ./armv8/.config || \
             echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_panther_x2=y' >> ./armv8/.config
           # ---- 两个致命开关 ----
           # 上游 easepi-r1 config.buildinfo 自带两项，均不属于本仓库目标配置：
           #
           #   CONFIG_TARGET_ALL_PROFILES=y
           #     -> 强制构建 *所有* 已注册到 TARGET_DEVICES 的板型，包括本仓库
           #        脚本注册的 tvi_tvi3315a。25.12 已无 files/ 注入点，
           #        rk3399 dts 不进内核树，导致 dtb 编译失败：
           #          cc1: fatal error: .../rockchip/rk3399-tvi3315a.dts: No such file
           #          ERROR: target/linux failed to build.
           #
           #   CONFIG_ALL_KMODS=y
           #     -> 编译全部 kmod，把 .config 撑到 365+ 行，
           #        编译时间从 ~1.5h 涨到 5.5h 且最终失败。
           if grep -q '^CONFIG_TARGET_ALL_PROFILES=y$' ./armv8/.config; then
             sed -i -E 's/^CONFIG_TARGET_ALL_PROFILES=y$/# CONFIG_TARGET_ALL_PROFILES is not set/' ./armv8/.config
           elif ! grep -q '^CONFIG_TARGET_ALL_PROFILES' ./armv8/.config; then
             echo '# CONFIG_TARGET_ALL_PROFILES is not set' >> ./armv8/.config
           fi
           if grep -q '^CONFIG_ALL_KMODS=y$' ./armv8/.config; then
             sed -i -E 's/^CONFIG_ALL_KMODS=y$/# CONFIG_ALL_KMODS is not set/' ./armv8/.config
           elif ! grep -q '^CONFIG_ALL_KMODS' ./armv8/.config; then
             echo '# CONFIG_ALL_KMODS is not set' >> ./armv8/.config
           fi
           echo "归一化后的目标设备:"
           grep -E '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_.*=y$' ./armv8/.config || echo "  (异常：无启用设备)"
           echo "归一化后的构建范围:"
           grep -E '^(# )?CONFIG_(TARGET_ALL_PROFILES|ALL_KMODS)(=| is not set)' ./armv8/.config || echo "  (异常：未找到)"
        else
           echo "不处理数据。"
        fi

    - name: 同步配置
      uses: peaceiris/actions-gh-pages@v4
      with:
        personal_token: ${{ secrets.ACCESS_TOKEN }}
        # 同步到触发该次运行的分支本身，避免 24.10 分支的配置被写回 main
        publish_branch: ${{ github.ref_name }}
        publish_dir: ./
        user_name: 'GitHub Action'
        user_email: 'github-actions[bot]@github.com'
        exclude_assets: ''
        keep_files: true
        commit_message: "Sync files"

    - name: 删除运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 1
        token: ${{ secrets.ACCESS_TOKEN }}
